# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build And Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Selector semantics in SQL, and the store properties built on them, are
    # tested against a real Postgres. Those tests skip without
    # WYRD_TEST_POSTGRES_URL, so CI provides one; each test works in a private
    # schema of its own.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wyrd
          POSTGRES_PASSWORD: wyrd
          POSTGRES_DB: wyrd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WYRD_TEST_POSTGRES_URL: postgres://wyrd:wyrd@localhost:5432/wyrd?sslmode=disable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Audit and Test
      run: make audit
